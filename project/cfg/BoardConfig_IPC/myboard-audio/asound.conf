# PCM5102A has no hardware playback volume control. Provide one in ALSA.
pcm.pcm5102a_softvol {
    type softvol
    slave.pcm "hw:0,0"
    control {
        name "PCM Playback Volume"
        card 0
    }
    min_dB -60.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "pcm5102a_softvol"
}

ctl.!default {
    type hw
    card 0
}
